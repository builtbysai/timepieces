<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluid — the time runs together</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #060608; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function () {
  'use strict';
  // FLUID — a binary clock whose pieces move like 2048 tiles.
  // Timepieces № 08.
  //
  // Six columns (hours, minutes, seconds; two digits each), four rows
  // of bits (8 4 2 1). Each lit bit is a droplet of amber on the grid.
  // The motion language is 2048's: pieces GLIDE along the grid with a
  // fast ease, and when two pieces meet they MERGE with a pop.
  // A droplet that lights is born inside the lit cluster beside it
  // and glides out to its home cell. Droplets lit side by side slide
  // toward each other until they touch and fuse into one body, both
  // cores still visible inside it, with the merge pop. When a bit
  // goes dark, its droplet is absorbed: it glides into the nearest
  // surviving droplet as it shrinks. Everything is drawn as crisp
  // vector shapes — hard rim, bright core, no blur anywhere.
  // Tap toggles the small decimal digits.

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var params = new URLSearchParams(location.search);
  var freezeT = params.has('t') ? parseInt(params.get('t'), 10) : null;
  var pinMerge = params.has('merge'); // pin a merge mid-glide for stills

  var BITS = [8, 4, 2, 1];
  var state = [];   // [col][bit] -> droplet
  var showDigits = true;

  function nowHMS() {
    if (freezeT !== null) {
      var t = ((freezeT % 86400) + 86400) % 86400;
      return [Math.floor(t / 3600), Math.floor(t / 60) % 60, t % 60];
    }
    var d = new Date();
    return [d.getHours(), d.getMinutes(), d.getSeconds()];
  }

  function layout() {
    var portrait = H >= W;
    var cellR = portrait ? Math.min(W * 0.056, H * 0.040) : Math.min(H * 0.056, W * 0.028);
    var rowGap = cellR * 2.24;
    var colGapIn = cellR * 2.28;
    var colGapPair = cellR * 3.30;
    var totalW = colGapIn * 3 + colGapPair * 2;
    var x0 = (W - totalW) / 2;
    var gridH = rowGap * 3;
    var cy = H * 0.46;
    var yTop = cy - gridH / 2;
    var xs = [], ys = [];
    for (var c = 0; c < 6; c++) {
      xs.push(x0 + Math.floor(c / 2) * (colGapIn + colGapPair) + (c % 2) * colGapIn);
    }
    for (var b = 0; b < 4; b++) ys.push(yTop + b * rowGap);
    return { cellR: cellR, xs: xs, ys: ys, cy: cy, gridBot: yTop + gridH, rowGap: rowGap, colGapIn: colGapIn };
  }

  var L0 = null;
  function homeOf(c, b) { return { x: L0.xs[c], y: L0.ys[b] }; }

  function blankState(h, m, s) {
    var digs = [
      Math.floor(h / 10), h % 10,
      Math.floor(m / 10), m % 10,
      Math.floor(s / 10), s % 10
    ];
    var st = [];
    for (var c = 0; c < 6; c++) {
      var col = [];
      for (var b = 0; b < 4; b++) {
        var on = (digs[c] & BITS[b]) !== 0;
        var home = homeOf(c, b);
        col.push({
          on: on, amt: on ? 1 : 0,
          x: home.x, y: home.y, vx: 0, vy: 0,
          pop: 0, tx: home.x, ty: home.y, run: 1
        });
      }
      st.push(col);
    }
    return st;
  }

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    if (!state.length) {
      L0 = layout();
      var t = nowHMS();
      state = blankState(t[0], t[1], t[2]);
    }
  }
  window.addEventListener('resize', resize);

  canvas.addEventListener('pointerdown', function () { showDigits = !showDigits; });

  // runs of adjacent lit bits, vertically in a column and horizontally
  // within a digit pair; returns for each cell its run size and the
  // run's centre (in cell coordinates)
  function computeRuns() {
    var runs = [];
    for (var c = 0; c < 6; c++) {
      runs.push([null, null, null, null]);
    }
    for (var c2 = 0; c2 < 6; c2++) {
      var b = 0;
      while (b < 4) {
        if (!state[c2][b].on) { b++; continue; }
        var e = b;
        while (e + 1 < 4 && state[c2][e + 1].on) e++;
        var n = e - b + 1, cen = (b + e) / 2;
        for (var k = b; k <= e; k++) runs[c2][k] = { n: n, cenB: cen, cenC: c2 };
        b = e + 1;
      }
    }
    // horizontal pairs can extend a run across the two columns of a digit
    for (var p = 0; p < 3; p++) {
      var cL = p * 2, cR = p * 2 + 1;
      for (var b2 = 0; b2 < 4; b2++) {
        if (state[cL][b2].on && state[cR][b2].on) {
          var rl = runs[cL][b2], rr = runs[cR][b2];
          if (rl && rr) {
            var cenC = (cL + cR) / 2;
            rl.hN = 2; rl.cenC = cenC;
            rr.hN = 2; rr.cenC = cenC;
          }
        }
      }
    }
    return runs;
  }

  function tickTargets(now) {
    var t = nowHMS();
    var digs = [
      Math.floor(t[0] / 10), t[0] % 10,
      Math.floor(t[1] / 10), t[1] % 10,
      Math.floor(t[2] / 10), t[2] % 10
    ];
    for (var c = 0; c < 6; c++) {
      for (var b = 0; b < 4; b++) {
        var cell = state[c][b];
        var on = (digs[c] & BITS[b]) !== 0;
        if (on !== cell.on) {
          cell.on = on;
          var home = homeOf(c, b);
          if (on) {
            // born inside the nearest lit neighbour, glides home
            var src = null;
            [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(function (d) {
              var cc = c + d[0], bb = b + d[1];
              if (src || cc < 0 || cc > 5 || bb < 0 || bb > 3) return;
              if (state[cc][bb].on && state[cc][bb].amt > 0.3) src = state[cc][bb];
            });
            if (src) { cell.x = src.x; cell.y = src.y; }
            else { cell.x = home.x; cell.y = home.y; }
            cell.vx = 0; cell.vy = 0;
          }
          cell.pop = 1;
          // merging neighbours share the pop
          if (b > 0) state[c][b - 1].pop = Math.max(state[c][b - 1].pop, 0.7);
          if (b < 3) state[c][b + 1].pop = Math.max(state[c][b + 1].pop, 0.7);
        }
      }
    }
    // targets: droplets in a run crowd toward the run centre until
    // they touch (spacing = 1.62 R instead of the grid's 2.24 R)
    var runs = computeRuns();
    var pull = (L0.rowGap - L0.cellR * 1.62) / L0.rowGap; // fraction of the gap closed
    for (var c2 = 0; c2 < 6; c2++) {
      for (var b2 = 0; b2 < 4; b2++) {
        var cl = state[c2][b2];
        var home = homeOf(c2, b2);
        var rn = runs[c2][b2];
        cl.run = rn ? rn.n : 1;
        var tx = home.x, ty = home.y;
        if (rn && rn.n > 1) {
          var cenY = L0.ys[0] + rn.cenB * L0.rowGap;
          ty = home.y + (cenY - home.y) * pull * 0.92;
        }
        if (rn && rn.hN === 2) {
          var cenX = (L0.xs[c2] + L0.xs[c2 % 2 === 0 ? c2 + 1 : c2 - 1]) / 2;
          var pullX = (L0.colGapIn - L0.cellR * 1.66) / L0.colGapIn;
          tx = home.x + (cenX - home.x) * pullX * 0.92;
        }
        cl.tx = tx; cl.ty = ty;
        if (!cl.on) {
          // dying droplet: absorbed into the nearest surviving droplet
          // in its column, or shrinks in place if none survives
          var best = null, bd = 1e9;
          for (var b3 = 0; b3 < 4; b3++) {
            if (state[c2][b3].on) {
              var dd = Math.abs(b3 - b2);
              if (dd < bd) { bd = dd; best = state[c2][b3]; }
            }
          }
          if (best) { cl.tx = best.tx; cl.ty = best.ty; }
        }
      }
    }
    return t;
  }

  var last = performance.now();

  function drawDrop(x, y, R) {
    var g = ctx.createRadialGradient(x - R * 0.32, y - R * 0.36, R * 0.08, x, y, R);
    g.addColorStop(0, '#ffdf9e');
    g.addColorStop(0.42, '#ffb84f');
    g.addColorStop(0.82, '#f08c1e');
    g.addColorStop(1, '#d8740f');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, R, 0, 6.283);
    ctx.fill();
    ctx.strokeStyle = 'rgba(146,64,8,0.45)';
    ctx.lineWidth = Math.max(1, R * 0.04);
    ctx.stroke();
    var gg = ctx.createRadialGradient(x - R * 0.34, y - R * 0.40, 0, x - R * 0.34, y - R * 0.40, R * 0.46);
    gg.addColorStop(0, 'rgba(255,250,228,0.75)');
    gg.addColorStop(1, 'rgba(255,250,228,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(x - R * 0.34, y - R * 0.40, R * 0.46, 0, 6.283);
    ctx.fill();
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    L0 = layout();
    var t = tickTargets(now);
    var r = L0.cellR;

    // 2048 glide: stiff springs, settle in about 150 ms, tiny overshoot
    for (var c = 0; c < 6; c++) {
      for (var b = 0; b < 4; b++) {
        var cell = state[c][b];
        var target = cell.on ? 1 : 0;
        cell.amt += (target - cell.amt) * Math.min(1, dt * 13);
        if (cell.amt < 0.005 && !cell.on) cell.amt = 0;
        var k = 340, damp = 30;
        cell.vx += ((cell.tx - cell.x) * k - cell.vx * damp) * dt;
        cell.vy += ((cell.ty - cell.y) * k - cell.vy * damp) * dt;
        cell.x += cell.vx * dt;
        cell.y += cell.vy * dt;
        cell.pop *= Math.exp(-dt * 7);
      }
    }
    if (pinMerge) {
      // seconds-ones column, bits 2 and 1: pin mid-merge
      state[5][2].x = L0.xs[5]; state[5][2].y = (L0.ys[2] + L0.ys[3]) / 2 + r * 0.18;
      state[5][2].pop = 0.55;
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var room = ctx.createRadialGradient(W / 2, L0.cy, 0, W / 2, L0.cy, Math.max(W, H) * 0.72);
    room.addColorStop(0, '#10101a');
    room.addColorStop(0.55, '#0a0a12');
    room.addColorStop(1, '#050508');
    ctx.fillStyle = room;
    ctx.fillRect(0, 0, W, H);

    // fused bodies first (bridges), then droplets with their cores
    var drawn = [];
    for (var c2 = 0; c2 < 6; c2++) {
      for (var b2 = 0; b2 < 4; b2++) {
        var cl = state[c2][b2];
        if (cl.amt <= 0.02) continue;
        var R = r * 0.96 * cl.amt * (1 + 0.15 * cl.pop);
        drawn.push({ c: c2, b: b2, x: cl.x, y: cl.y, R: R, amt: cl.amt, pop: cl.pop });
      }
    }
    // bridges between droplets whose centres are within 1.9 R
    ctx.lineCap = 'round';
    for (var i = 0; i < drawn.length; i++) {
      for (var j = i + 1; j < drawn.length; j++) {
        var A = drawn[i], B = drawn[j];
        var d = Math.hypot(A.x - B.x, A.y - B.y);
        var rr = Math.min(A.R, B.R);
        if (d < rr * 1.86 && d > 1) {
          // rim pass
          ctx.strokeStyle = 'rgba(146,64,8,0.9)';
          ctx.lineWidth = rr * 1.88 + Math.max(1.5, rr * 0.08);
          ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
          // fill pass
          var bg = ctx.createLinearGradient(A.x, A.y - rr, A.x, A.y + rr);
          bg.addColorStop(0, '#ffb84f');
          bg.addColorStop(1, '#e07f16');
          ctx.strokeStyle = bg;
          ctx.lineWidth = rr * 1.88;
          ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
        }
      }
    }
    drawn.forEach(function (d) { drawDrop(d.x, d.y, d.R); });

    // colon: two crisp beads that pulse, 2048-spawn style
    var pulse = 0.5 + 0.5 * Math.sin(now / 1000 * Math.PI);
    [1, 3].forEach(function (li) {
      var cxp = (L0.xs[li] + L0.xs[li + 1]) / 2;
      [-0.55, 0.55].forEach(function (off) {
        var rr = r * (0.20 + 0.05 * pulse);
        drawDrop(cxp, L0.cy + off * r * 1.05, rr);
      });
    });

    // reflections pooled under each column
    for (var c3 = 0; c3 < 6; c3++) {
      var glowAmt = 0;
      for (var b3 = 0; b3 < 4; b3++) glowAmt += state[c3][b3].amt;
      if (glowAmt <= 0.02) continue;
      var gx = L0.xs[c3], gy = L0.gridBot + r * 1.15;
      var refl = ctx.createRadialGradient(gx, gy, 0, gx, gy, r * 1.5);
      refl.addColorStop(0, 'rgba(255,178,92,' + (0.05 + 0.03 * glowAmt) + ')');
      refl.addColorStop(1, 'rgba(255,178,92,0)');
      ctx.fillStyle = refl;
      ctx.beginPath();
      ctx.ellipse(gx, gy, r * 1.5, r * 0.42, 0, 0, 6.283);
      ctx.fill();
    }

    if (showDigits) {
      var digs = [
        Math.floor(t[0] / 10), t[0] % 10,
        Math.floor(t[1] / 10), t[1] % 10,
        Math.floor(t[2] / 10), t[2] % 10
      ];
      ctx.fillStyle = 'rgba(214,204,188,0.5)';
      ctx.font = '500 ' + Math.round(r * 0.52) + 'px ui-monospace, Menlo, Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      for (var c4 = 0; c4 < 6; c4++) {
        ctx.fillText(String(digs[c4]), L0.xs[c4], L0.gridBot + r * 0.85);
      }
    }
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
