<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluid — the time runs together</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #060608; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function () {
  'use strict';
  // FLUID — a binary clock in liquid light. Timepieces № 08.
  //
  // Research notes (2026-10-23 rebuild):
  // * Binary clocks that work (the Berlin Mengenlehreuhr above all)
  //   use hard-edged fields on a strict grid. Every lamp stays a
  //   distinct, countable unit; nothing blurs. A fluid version has to
  //   keep that discipline: bits you can count, edges you can see.
  // * Real droplet coalescence is never blurry either. Two drops are
  //   sharp bodies until the film between them ruptures; then a
  //   liquid bridge appears and grows fast (radius ~ t^1/2 in the
  //   inertial regime), and the merged body oscillates, damped, into
  //   its resting shape. The interface is the sharpest thing in the
  //   picture at every instant.
  // So: the field is computed at full resolution over the clock's own
  // box and thresholded HARD (a two-pixel edge, with a darker rim just
  // inside the contour, like a meniscus). Each droplet keeps a bright
  // core, so inside a merged body you can still count the bits. When
  // a droplet lights next to a lit neighbour the bridge snaps in
  // quickly, and the whole cluster gets a damped wobble, the way a
  // merged drop rings before it settles.
  //
  // Six columns (hours, minutes, seconds; two digits each), four rows
  // of bits (8 4 2 1). Tap toggles the small decimal digits.

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var field = document.createElement('canvas');
  var fctx = field.getContext('2d', { willReadFrequently: true });
  var W = 0, H = 0, DPR = 1;

  var params = new URLSearchParams(location.search);
  var freezeT = params.has('t') ? parseInt(params.get('t'), 10) : null;
  var pinGrow = params.has('grow');

  var BITS = [8, 4, 2, 1];
  var state = [];
  var showDigits = true;

  function blankState(h, m, s) {
    var digs = [
      Math.floor(h / 10), h % 10,
      Math.floor(m / 10), m % 10,
      Math.floor(s / 10), s % 10
    ];
    var st = [];
    for (var c = 0; c < 6; c++) {
      var col = [];
      for (var b = 0; b < 4; b++) {
        var on = (digs[c] & BITS[b]) !== 0;
        col.push({ on: on, amt: on ? 1 : 0, vel: 0, wob: Math.random() * 6.28, kick: 0, born: -1e9 });
      }
      st.push(col);
    }
    return st;
  }

  function nowHMS() {
    if (freezeT !== null) {
      var t = ((freezeT % 86400) + 86400) % 86400;
      return [Math.floor(t / 3600), Math.floor(t / 60) % 60, t % 60];
    }
    var d = new Date();
    return [d.getHours(), d.getMinutes(), d.getSeconds()];
  }

  var hms = nowHMS();
  state = blankState(hms[0], hms[1], hms[2]);

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  window.addEventListener('resize', resize);
  resize();

  canvas.addEventListener('pointerdown', function () { showDigits = !showDigits; });

  function layout() {
    var portrait = H >= W;
    var cellR = portrait ? Math.min(W * 0.056, H * 0.040) : Math.min(H * 0.056, W * 0.028);
    var rowGap = cellR * 2.20;
    var colGapIn = cellR * 2.24;
    var colGapPair = cellR * 3.30;
    var totalW = colGapIn * 3 + colGapPair * 2;
    var x0 = (W - totalW) / 2;
    var gridH = rowGap * 3;
    var cy = H * 0.46;
    var yTop = cy - gridH / 2;
    var xs = [], ys = [];
    for (var c = 0; c < 6; c++) {
      xs.push(x0 + Math.floor(c / 2) * (colGapIn + colGapPair) + (c % 2) * colGapIn);
    }
    for (var b = 0; b < 4; b++) ys.push(yTop + b * rowGap);
    var pad = cellR * 2.6;
    return {
      cellR: cellR, xs: xs, ys: ys, cy: cy, gridBot: yTop + gridH,
      boxX: xs[0] - pad, boxY: ys[0] - pad,
      boxW: (xs[5] - xs[0]) + pad * 2, boxH: (ys[3] - ys[0]) + pad * 2
    };
  }

  function tickTargets(now) {
    var t = nowHMS();
    var digs = [
      Math.floor(t[0] / 10), t[0] % 10,
      Math.floor(t[1] / 10), t[1] % 10,
      Math.floor(t[2] / 10), t[2] % 10
    ];
    for (var c = 0; c < 6; c++) {
      for (var b = 0; b < 4; b++) {
        var cell = state[c][b];
        var on = (digs[c] & BITS[b]) !== 0;
        if (on !== cell.on) {
          cell.on = on;
          if (on) cell.born = now;
          // a change rings the cluster: the flipped droplet and its
          // lit neighbours take a wobble kick
          cell.kick = 1;
          if (b > 0) state[c][b - 1].kick = Math.max(state[c][b - 1].kick, 0.8);
          if (b < 3) state[c][b + 1].kick = Math.max(state[c][b + 1].kick, 0.8);
          if (c % 2 === 0) state[c + 1][b].kick = Math.max(state[c + 1][b].kick, 0.6);
          else state[c - 1][b].kick = Math.max(state[c - 1][b].kick, 0.6);
        }
      }
    }
    return t;
  }

  // shading by field strength: dark rim -> deep amber -> amber -> hot core
  function shade(f, out, i) {
    var r, g, b;
    if (f < 0.16) {           // the rim: just inside the contour
      var u = f / 0.16;
      r = 148 + (196 - 148) * u;
      g = 62 + (94 - 62) * u;
      b = 10 + (18 - 10) * u;
    } else if (f < 0.55) {
      var v = (f - 0.16) / 0.39;
      r = 196 + (247 - 196) * v;
      g = 94 + (164 - 94) * v;
      b = 18 + (58 - 18) * v;
    } else {
      var w = (f - 0.55) / 0.45;
      r = 247 + (255 - 247) * w;
      g = 164 + (221 - 164) * w;
      b = 58 + (156 - 58) * w;
    }
    out[i] = r; out[i + 1] = g; out[i + 2] = b;
  }

  var last = performance.now();

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var t = tickTargets(now);
    var L = layout();
    var r = L.cellR;

    // droplet springs (underdamped) + decaying cluster wobble
    for (var c = 0; c < 6; c++) {
      for (var b = 0; b < 4; b++) {
        var cell = state[c][b];
        var target = cell.on ? 1 : 0;
        var stiff = (target > cell.amt) ? 150 : 90;   // bridges snap in fast
        var acc = (target - cell.amt) * stiff - cell.vel * 12;
        cell.vel += acc * dt;
        cell.amt += cell.vel * dt;
        if (cell.amt < 0) { cell.amt = 0; cell.vel *= -0.3; }
        cell.kick *= Math.exp(-dt * 2.6);
      }
    }
    if (pinGrow) { state[5][2].amt = 0.55; state[5][2].on = true; state[5][2].kick = 0.7; }

    // ---------- field over the clock's box, near full resolution ----
    var FS = 1;
    var bw = Math.round(L.boxW), bh = Math.round(L.boxH);
    if (bw * bh > 520000) FS = Math.sqrt(520000 / (bw * bh));
    var fw = Math.max(2, Math.round(bw * FS)), fh = Math.max(2, Math.round(bh * FS));
    if (field.width !== fw || field.height !== fh) { field.width = fw; field.height = fh; }
    fctx.clearRect(0, 0, fw, fh);
    fctx.globalCompositeOperation = 'lighter';
    var drops = [];
    for (var c2 = 0; c2 < 6; c2++) {
      for (var b2 = 0; b2 < 4; b2++) {
        var cl = state[c2][b2];
        if (cl.amt <= 0.01) continue;
        var x = L.xs[c2], y = L.ys[b2];
        var leanX = 0, leanY = 0;
        if (b2 > 0 && state[c2][b2 - 1].amt > 0.5) leanY -= r * 0.09 * cl.amt;
        if (b2 < 3 && state[c2][b2 + 1].amt > 0.5) leanY += r * 0.09 * cl.amt;
        if (c2 % 2 === 0 && state[c2 + 1][b2].amt > 0.5) leanX += r * 0.07 * cl.amt;
        if (c2 % 2 === 1 && state[c2 - 1][b2].amt > 0.5) leanX -= r * 0.07 * cl.amt;
        var wob = 1 + 0.028 * Math.sin(now / 520 + cl.wob) * cl.amt
                    + 0.075 * cl.kick * Math.sin(now / 68 + cl.wob * 3);
        var R = r * (0.22 + 0.86 * cl.amt) * wob;
        drops.push({ x: x + leanX, y: y + leanY, R: R, amt: cl.amt });
        var fx = (x + leanX - L.boxX) * FS, fy = (y + leanY - L.boxY) * FS, fr = R * 1.52 * FS;
        var g = fctx.createRadialGradient(fx, fy, 0, fx, fy, fr);
        g.addColorStop(0, 'rgba(255,255,255,0.88)');
        g.addColorStop(0.55, 'rgba(255,255,255,0.40)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        fctx.fillStyle = g;
        fctx.beginPath();
        fctx.arc(fx, fy, fr, 0, 6.283);
        fctx.fill();
      }
    }
    var pulse = 0.72 + 0.28 * Math.sin(now / 1000 * Math.PI);
    [1, 3].forEach(function (li) {
      var cxp = (L.xs[li] + L.xs[li + 1]) / 2;
      [-0.55, 0.55].forEach(function (off) {
        var fx = (cxp - L.boxX) * FS, fy = (L.cy + off * r * 1.05 - L.boxY) * FS, fr = r * 0.42 * pulse * 1.5 * FS;
        var g = fctx.createRadialGradient(fx, fy, 0, fx, fy, fr);
        g.addColorStop(0, 'rgba(255,255,255,0.82)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        fctx.fillStyle = g;
        fctx.beginPath();
        fctx.arc(fx, fy, fr, 0, 6.283);
        fctx.fill();
      });
    });
    fctx.globalCompositeOperation = 'source-over';

    // ---------- HARD threshold: a two-pixel edge, rim inside --------
    var img = fctx.getImageData(0, 0, fw, fh);
    var px = img.data;
    var TH = 104, SOFT = 13;
    for (var i = 0; i < px.length; i += 4) {
      var a = px[i + 3];
      if (a <= TH - SOFT) { px[i + 3] = 0; continue; }
      var f = (a - (TH - SOFT)) / (255 - (TH - SOFT));
      if (f > 1) f = 1;
      var e = (a - TH) / SOFT;
      if (e > 1) e = 1;
      if (e < 0) e = 0;
      px[i + 3] = Math.round(255 * e);
      shade(f, px, i);
    }
    fctx.putImageData(img, 0, 0);

    // ---------- main pass ----------
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var room = ctx.createRadialGradient(W / 2, L.cy, 0, W / 2, L.cy, Math.max(W, H) * 0.72);
    room.addColorStop(0, '#0e0e14');
    room.addColorStop(0.55, '#090910');
    room.addColorStop(1, '#050507');
    ctx.fillStyle = room;
    ctx.fillRect(0, 0, W, H);

    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(field, L.boxX, L.boxY, L.boxW, L.boxH);

    // gloss: one tight highlight per droplet, clipped by nothing but
    // small enough to sit inside the body
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drops.forEach(function (d) {
      var gg = ctx.createRadialGradient(d.x - d.R * 0.30, d.y - d.R * 0.36, 0, d.x - d.R * 0.30, d.y - d.R * 0.36, d.R * 0.5);
      gg.addColorStop(0, 'rgba(255,246,220,' + (0.16 * d.amt) + ')');
      gg.addColorStop(1, 'rgba(255,246,220,0)');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(d.x - d.R * 0.30, d.y - d.R * 0.36, d.R * 0.5, 0, 6.283);
      ctx.fill();
    });
    ctx.restore();

    // reflections pooled under each column
    for (var c3 = 0; c3 < 6; c3++) {
      var glowAmt = 0;
      for (var b3 = 0; b3 < 4; b3++) glowAmt += state[c3][b3].amt;
      if (glowAmt <= 0.02) continue;
      var gx = L.xs[c3], gy = L.gridBot + r * 1.15;
      var refl = ctx.createRadialGradient(gx, gy, 0, gx, gy, r * 1.5);
      refl.addColorStop(0, 'rgba(255,178,92,' + (0.05 + 0.03 * glowAmt) + ')');
      refl.addColorStop(1, 'rgba(255,178,92,0)');
      ctx.fillStyle = refl;
      ctx.beginPath();
      ctx.ellipse(gx, gy, r * 1.5, r * 0.42, 0, 0, 6.283);
      ctx.fill();
    }

    if (showDigits) {
      var digs = [
        Math.floor(t[0] / 10), t[0] % 10,
        Math.floor(t[1] / 10), t[1] % 10,
        Math.floor(t[2] / 10), t[2] % 10
      ];
      ctx.fillStyle = 'rgba(214,204,188,0.5)';
      ctx.font = '500 ' + Math.round(r * 0.52) + 'px ui-monospace, Menlo, Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      for (var c4 = 0; c4 < 6; c4++) {
        ctx.fillText(String(digs[c4]), L.xs[c4], L.gridBot + r * 0.85);
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
