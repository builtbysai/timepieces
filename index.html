<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timepieces — Hans Sai</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:#060607; color:#e8e6df;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { padding:56px 24px 40px; max-width:1200px; margin:0 auto; }
  .kicker { font-size:11px; letter-spacing:.22em; color:#6b6f7a; text-transform:uppercase; }
  h1 { font-size:clamp(26px,4vw,40px); font-weight:600; letter-spacing:-.02em; margin-top:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:2px; background:#0c0d11; }
  .card { position:relative; display:block; aspect-ratio:16/10; overflow:hidden;
    text-decoration:none; color:inherit; background:#0a0a0d; }
  .card img { width:100%; height:100%; object-fit:cover; display:block;
    transition:transform .6s ease; }
  .card:hover img { transform:scale(1.04); }
  .card .label { position:absolute; left:0; right:0; bottom:0; padding:20px;
    background:linear-gradient(transparent,rgba(0,0,0,.78)); }
  .card .no { font-size:10px; letter-spacing:.2em; color:#9a9ea8; }
  .card h2 { font-size:20px; margin-top:6px; letter-spacing:-.01em; }
  footer { padding:40px 24px; text-align:center; font-size:11px;
    letter-spacing:.1em; color:#55565e; }
</style>
</head>
<body>
<header>
  <div class="kicker">Hans Sai</div>
  <h1>Timepieces</h1>
</header>
<div class="grid">
  <a class="card" href="meridian/">
    <img src="meridian/thumb.jpg" alt="Meridian">
    <div class="label"><div class="no">№ 01</div><h2>Meridian</h2></div>
  </a>
  <a class="card" href="digits/">
    <img src="digits/thumb.jpg" alt="Digits">
    <div class="label"><div class="no">№ 02</div><h2>Digits</h2></div>
  </a>
  <a class="card" href="word/">
    <img src="word/thumb.jpg" alt="Word">
    <div class="label"><div class="no">№ 03</div><h2>Word</h2></div>
  </a>
  <a class="card" href="hex/">
    <img src="hex/thumb.jpg" alt="Hex">
    <div class="label"><div class="no">№ 04</div><h2>Hex</h2></div>
  </a>
  <a class="card" href="spiral/">
    <img src="spiral/thumb.jpg" alt="Spiral">
    <div class="label"><div class="no">№ 05</div><h2>Spiral</h2></div>
  </a>
  <a class="card" href="tide/">
    <img src="tide/thumb.jpg" alt="Tide">
    <div class="label"><div class="no">№ 06</div><h2>Tide</h2></div>
  </a>
  <a class="card" href="binary/">
    <img src="binary/thumb.jpg" alt="Binary">
    <div class="label"><div class="no">№ 07</div><h2>Binary</h2></div>
  </a>
  <a class="card" href="fluid/">
    <img src="fluid/thumb.jpg" alt="Fluid">
    <div class="label"><div class="no">№ 08</div><h2>Fluid</h2></div>
  </a>
</div>
<footer>every second, eight ways</footer>
</body>
</html>
