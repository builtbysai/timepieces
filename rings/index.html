<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rings</title>
<!-- rings-no12-cylinder -->
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f3ecdc; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.corner { position:fixed; top:18px; left:20px; color:rgba(107,84,58,0.65);
  font:11px/1.4 Georgia,'Times New Roman',serif;
  letter-spacing:0.28em; pointer-events:none; user-select:none; }
.clock { position:fixed; left:0; right:0; bottom:max(20px, env(safe-area-inset-bottom));
  text-align:center; color:rgba(107,84,58,0.9);
  font:16px/1.4 Georgia,'Times New Roman',serif;
  letter-spacing:0.34em; pointer-events:none; user-select:none; }
.hint { position:fixed; left:0; right:0; bottom:calc(max(20px, env(safe-area-inset-bottom)) + 32px);
  text-align:center; color:rgba(107,84,58,0.45);
  font:11px/1.4 Georgia,'Times New Roman',serif;
  letter-spacing:0.22em; pointer-events:none; user-select:none;
  transition:opacity 1.2s ease; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="corner">№ 12 &middot; RINGS</div>
<div class="hint" id="hint">tap for hour marks</div>
<div class="clock" id="clock"></div>
<script>
'use strict';
// Rings, watercolor, after the reference: a cut log lying in a
// meadow, seen at a low angle. The top face is a wide pale ellipse
// with twenty-four fine growth rings, one per hour, pith at
// midnight, bark at next midnight. Hours already lived are a
// touch warmer; the current hour's ring is a thin bright gold arc
// sweeping clockwise from the top through the minute, its leading
// tip the living cambium. Hours not yet reached are faint pencil
// lines, wood not yet grown. The log has a real bark side wall
// below the face. Two delicate twig hands read the time the
// ordinary way. Count the rings from the centre for the hour; the
// open arc's sweep is the minute. Tap to show hour marks.
// ?hour=15.5 pins the time.

const canvas = document.getElementById('stage');
const clockEl = document.getElementById('clock');
const hintEl = document.getElementById('hint');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const BG = '#f3ecdc';
const INK = '107,84,58';           // warm brown ink for marks and text

let showLabels = false;
let hintHidden = false;

function srand(seed){ let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => { s = s * 16807 % 2147483647; return (s - 1) / 2147483646; }; }

// Per-ring wobble: mostly ONE shared slow shape (the trunk's
// eccentricity, so rings stay parallel like real wood) plus a
// small per-ring ripple. Amplitudes stay far under the ring
// spacing so rings never cross.
const SHAPE = { p0: 1.1, p1: 2.6 };
const RINGS = [];
for (let i = 0; i < 24; i++) {
  const rnd = srand(101 + i * 37);
  RINGS.push({
    a3: 0.02 + rnd() * 0.03, p3: rnd() * Math.PI * 2,
    tone: 0.85 + rnd() * 0.30
  });
}
function wobble(i, th, step) {
  const r = RINGS[i];
  return step * (0.09 * Math.sin(th + SHAPE.p0)
               + 0.05 * Math.sin(2 * th + SHAPE.p1)
               + r.a3 * Math.sin(3 * th + r.p3));
}

// The meadow, seeded once so it never shivers between frames:
// soft wash patches, moss bushes, grass tufts, fallen leaves,
// tiny flowers, pebbles. Grass/leaves/flowers store y as a
// fraction of the meadow band (remapped at draw time so they
// never crowd the bottom text).
const MEADOW = (() => {
  const rnd = srand(20261108);
  const washes = [];
  for (let i = 0; i < 12; i++) washes.push({ x: rnd(), y: rnd(), r: 0.10 + rnd() * 0.16, c: i % 3 });
  const moss = [];
  for (let i = 0; i < 4; i++) moss.push({ x: 0.06 + rnd() * 0.88, y: 0.45 + rnd() * 0.4, r: 0.02 + rnd() * 0.025, blobs: 4 + Math.floor(rnd() * 3) });
  const grass = [];
  for (let i = 0; i < 30; i++) grass.push({ x: rnd(), y: rnd(), h: 0.012 + rnd() * 0.02, lean: (rnd() - 0.5) * 0.14, blades: 2 + Math.floor(rnd() * 3) });
  const leaves = [];
  const LEAF_COLS = ['#d97b2e', '#e0a83c', '#8a9a4b', '#b45a2e', '#c98a3a', '#d9a03c'];
  for (let i = 0; i < 16; i++) leaves.push({
    x: rnd(), y: rnd(), s: 0.011 + rnd() * 0.015,
    rot: rnd() * Math.PI * 2, maple: rnd() < 0.5, col: LEAF_COLS[Math.floor(rnd() * LEAF_COLS.length)]
  });
  const flowers = [];
  for (let i = 0; i < 5; i++) flowers.push({ x: rnd(), y: rnd(), s: 0.005 + rnd() * 0.005, pink: rnd() < 0.5 });
  const pebbles = [];
  for (let i = 0; i < 6; i++) pebbles.push({ x: rnd(), y: rnd(), r: 0.002 + rnd() * 0.003 });
  const cracks = [];
  for (let i = 0; i < 4; i++) cracks.push({ a: rnd() * Math.PI * 2, len: 0.35 + rnd() * 0.45 });
  const speck = [];
  for (let i = 0; i < 300; i++) speck.push({ x: rnd(), y: rnd(), r: 0.4 + rnd() * 1.1, a: 0.02 + rnd() * 0.05 });
  const barkStrokes = [];
  for (let i = 0; i < 46; i++) barkStrokes.push({ x: rnd(), len: 0.4 + rnd() * 0.6, a: 0.28 + rnd() * 0.32, dark: rnd() < 0.5 });
  return { washes, moss, grass, leaves, flowers, pebbles, cracks, speck, barkStrokes };
})();
const WASH_COLS = ['rgba(223,227,200,0.5)', 'rgba(240,223,184,0.55)', 'rgba(232,220,192,0.5)'];

function realHours() {
  const forced = parseFloat(new URLSearchParams(location.search).get('hour'));
  if (isFinite(forced)) return forced;
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600 + d.getMilliseconds() / 3600000;
}

// Trace a ring (full circle or arc) as a path, following its wobble.
function ringPath(cx, cy, r, i, step, a0, a1) {
  const n = Math.max(48, Math.floor((a1 - a0) / (Math.PI * 2) * 360));
  ctx.beginPath();
  for (let k = 0; k <= n; k++) {
    const th = a0 + (a1 - a0) * k / n;
    const rr = r + wobble(i, th, step);
    const x = cx + Math.cos(th) * rr, y = cy + Math.sin(th) * rr;
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
}

function drawMapleLeaf(x, y, s, rot, col) {
  // five-lobed maple leaf: notched silhouette, stem, veins
  const PTS = [
    [0, -1.0], [0.28, -0.62], [0.75, -0.75], [0.55, -0.35], [0.95, -0.15],
    [0.5, 0.05], [0.55, 0.55], [0.2, 0.45], [0.12, 0.9], [0, 0.65],
    [-0.12, 0.9], [-0.2, 0.45], [-0.55, 0.55], [-0.5, 0.05], [-0.95, -0.15],
    [-0.55, -0.35], [-0.75, -0.75], [-0.28, -0.62]
  ];
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(PTS[0][0] * s, PTS[0][1] * s);
  for (let k = 1; k < PTS.length; k++) ctx.lineTo(PTS[k][0] * s, PTS[k][1] * s);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(90,64,38,0.5)';
  ctx.lineWidth = Math.max(0.6, s * 0.05);
  ctx.beginPath(); ctx.moveTo(0, s * 0.6); ctx.lineTo(0, s * 1.15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, s * 0.5); ctx.lineTo(0, -s * 0.7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, s * 0.45); ctx.lineTo(-s * 0.6, -s * 0.55); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, s * 0.45); ctx.lineTo(s * 0.6, -s * 0.55); ctx.stroke();
  ctx.restore();
}

function drawOvalLeaf(x, y, s, rot, col) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(0, 0, s, s * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90,64,38,0.45)';
  ctx.lineWidth = Math.max(0.6, s * 0.07);
  ctx.beginPath(); ctx.moveTo(-s * 0.9, 0); ctx.lineTo(s * 0.9, 0); ctx.stroke();
  ctx.restore();
}

function drawGrass(x, y, h, lean, blades) {
  ctx.strokeStyle = 'rgba(140,155,100,0.75)';
  ctx.lineWidth = Math.max(0.7, h * 0.05);
  ctx.lineCap = 'round';
  for (let b = 0; b < blades; b++) {
    const off = (b - (blades - 1) / 2) * h * 0.3;
    const bh = h * (0.7 + ((b * 37) % 10) / 25);   // blades differ in height
    const tipX = x + off + lean * bh * 6 + (b % 2 ? bh * 0.18 : -bh * 0.18);
    ctx.beginPath();
    ctx.moveTo(x + off, y);
    ctx.quadraticCurveTo(x + off + lean * bh * 3, y - bh * 0.6, tipX, y - bh);
    ctx.stroke();
  }
}

function drawFlower(x, y, s, pink) {
  ctx.fillStyle = pink ? 'rgba(232,180,190,0.95)' : 'rgba(250,250,246,0.95)';
  for (let k = 0; k < 5; k++) {
    const a = -Math.PI / 2 + k * (Math.PI * 2 / 5);
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * s, y + Math.sin(a) * s, s * 0.55, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#e0a83c';
  ctx.beginPath(); ctx.arc(x, y, s * 0.45, 0, Math.PI * 2); ctx.fill();
}

function drawMoss(x, y, r, blobs) {
  // a soft mossy patch: overlapping sage washes, no hard edges
  const rnd = srand(Math.floor(x * 1000 + y * 100));
  for (let b = 0; b < blobs; b++) {
    const bx = x + (rnd() - 0.5) * r * 1.2, by = y + (rnd() - 0.5) * r * 0.6;
    const br = r * (0.4 + rnd() * 0.4);
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, br);
    g.addColorStop(0, 'rgba(139,154,101,0.38)');
    g.addColorStop(1, 'rgba(139,154,101,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
  }
}

function drawTwigHand(cx, cy, len, angle, w) {
  // a delicate twig: main stem, one fork near the tip, a knot at the base
  const tipX = cx + Math.cos(angle) * len, tipY = cy + Math.sin(angle) * len;
  const midX = cx + Math.cos(angle) * len * 0.62, midY = cy + Math.sin(angle) * len * 0.62;
  ctx.strokeStyle = '#6b4a2f';
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(tipX, tipY); ctx.stroke();
  const forkA = angle - 0.5, forkL = len * 0.22;
  ctx.lineWidth = w * 0.6;
  ctx.beginPath();
  ctx.moveTo(midX, midY);
  ctx.lineTo(midX + Math.cos(forkA) * forkL, midY + Math.sin(forkA) * forkL);
  ctx.stroke();
}

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, w, h);
  ctx.lineCap = 'round';

  const hrs = ((realHours() % 24) + 24) % 24;
  const hour = Math.floor(hrs);
  const minuteFrac = hrs - hour;                 // 0..1 through the hour
  const sec = new Date().getSeconds() + new Date().getMilliseconds() / 1000;

  const cx = w / 2, cy = h * 0.40;               // log centre, room below for the wall and meadow
  const maxR = Math.min(w, h) * 0.37;
  const step = maxR / 25.5;                      // 24 rings + pith + bark margin
  const r0 = step * 1.6;                         // pith radius
  const ringR = i => r0 + i * step;
  const SQUASH = 0.72;                           // low-angle view, like the reference
  const wallH = maxR * 0.26;                     // bark side wall height

  // paper: soft watercolor washes and grain
  for (const ws of MEADOW.washes) {
    const g = ctx.createRadialGradient(ws.x * w, ws.y * h, 0, ws.x * w, ws.y * h, ws.r * Math.max(w, h));
    g.addColorStop(0, WASH_COLS[ws.c]);
    g.addColorStop(1, 'rgba(243,236,220,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }
  for (const sp of MEADOW.speck) {
    ctx.fillStyle = 'rgba(' + INK + ',' + sp.a + ')';
    ctx.beginPath(); ctx.arc(sp.x * w, sp.y * h, sp.r, 0, Math.PI * 2); ctx.fill();
  }

  // moss bushes behind the log
  for (const mo of MEADOW.moss) drawMoss(mo.x * w, mo.y * h, mo.r * Math.max(w, h), mo.blobs);

  // soft shadow under the log
  ctx.fillStyle = 'rgba(90,70,40,0.16)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + wallH + maxR * SQUASH * 0.98, maxR * 1.02, maxR * 0.15, 0, 0, Math.PI * 2);
  ctx.fill();

  // bark side wall: the log's thickness, extruded below the top face
  const wallGrad = ctx.createLinearGradient(0, cy, 0, cy + wallH);
  wallGrad.addColorStop(0, '#9a7a52');
  wallGrad.addColorStop(1, '#6b4a2c');
  ctx.fillStyle = wallGrad;
  ctx.beginPath();
  ctx.moveTo(cx - maxR, cy);
  ctx.lineTo(cx - maxR, cy + wallH);
  ctx.ellipse(cx, cy + wallH, maxR, maxR * SQUASH, 0, Math.PI, 0, true);
  ctx.lineTo(cx + maxR, cy);
  ctx.closePath();
  ctx.fill();
  // bottom edge of the log, darker
  ctx.strokeStyle = 'rgba(70,48,24,0.85)';
  ctx.lineWidth = Math.max(1.5, maxR * 0.012);
  ctx.beginPath();
  ctx.ellipse(cx, cy + wallH, maxR, maxR * SQUASH, 0, 0, Math.PI, false);
  ctx.stroke();

  // the top face, drawn in circle coords inside a squash transform
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, SQUASH);
  ctx.translate(-cx, -cy);

  // pale wood disc
  ctx.fillStyle = '#efe4c8';
  ctx.beginPath(); ctx.arc(cx, cy, ringR(23) + step * 0.85, 0, Math.PI * 2); ctx.fill();

  // sunlight from the top-left, soft shade at the bottom-right
  const sun = ctx.createLinearGradient(cx - maxR, cy - maxR, cx + maxR, cy + maxR);
  sun.addColorStop(0, 'rgba(255,250,235,0.35)');
  sun.addColorStop(0.6, 'rgba(255,250,235,0)');
  sun.addColorStop(1, 'rgba(150,110,60,0.10)');
  ctx.fillStyle = sun;
  ctx.beginPath(); ctx.arc(cx, cy, ringR(23) + step * 0.85, 0, Math.PI * 2); ctx.fill();

  // warm wash over the hours already lived, fading out at its edge
  if (hour > 0) {
    const washR = ringR(hour - 1) + step * 0.5;
    const wash = ctx.createRadialGradient(cx, cy, 0, cx, cy, washR);
    wash.addColorStop(0, 'rgba(210,160,90,0.20)');
    wash.addColorStop(0.75, 'rgba(210,160,90,0.10)');
    wash.addColorStop(1, 'rgba(210,160,90,0)');
    ctx.fillStyle = wash;
    ctx.beginPath(); ctx.arc(cx, cy, washR, 0, Math.PI * 2); ctx.fill();
  }

  // faint radial cracks, like dried wood
  ctx.strokeStyle = 'rgba(' + INK + ',0.13)';
  ctx.lineWidth = Math.max(0.7, step * 0.05);
  for (const cr of MEADOW.cracks) {
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(cr.a) * step * 1.2, cy + Math.sin(cr.a) * step * 1.2);
    ctx.lineTo(cx + Math.cos(cr.a) * ringR(23) * cr.len, cy + Math.sin(cr.a) * ringR(23) * cr.len);
    ctx.stroke();
  }

  // all twenty-four rings, fine lines like the reference.
  // Lived ones a touch warmer and darker; unreached ones faint pencil.
  for (let i = 0; i < 24; i++) {
    ringPath(cx, cy, ringR(i), i, step, 0, Math.PI * 2);
    ctx.lineWidth = Math.max(0.8, step * 0.055);
    if (i < hour) ctx.strokeStyle = 'rgba(150,110,60,' + (0.30 + RINGS[i].tone * 0.18) + ')';
    else if (i === hour) ctx.strokeStyle = 'rgba(' + INK + ',0.20)';
    else ctx.strokeStyle = 'rgba(' + INK + ',0.16)';
    ctx.stroke();
  }

  // the growing ring: thin bright gold arc of the hour so far
  const gi = hour;
  const a0 = -Math.PI / 2;                       // arc starts at the top
  const a1 = a0 + minuteFrac * Math.PI * 2;
  ringPath(cx, cy, ringR(gi), gi, step, a0, a1);
  ctx.lineWidth = step * 0.22;
  ctx.strokeStyle = 'rgba(245,197,66,0.35)';
  ctx.stroke();
  ringPath(cx, cy, ringR(gi), gi, step, a0, a1);
  ctx.lineWidth = step * 0.13;
  ctx.strokeStyle = '#f5c542';
  ctx.stroke();

  // cambium tip: bright gold point at the growing edge, breathing with the second
  const tipR = ringR(gi) + wobble(gi, a1, step);
  const tx = cx + Math.cos(a1) * tipR, ty = cy + Math.sin(a1) * tipR;
  const pulse = 0.75 + 0.25 * Math.sin(sec * Math.PI * 2 / 2);   // slow 2s breath
  const glowR = step * (1.1 + 0.4 * pulse);
  const glow = ctx.createRadialGradient(tx, ty, 0, tx, ty, glowR);
  glow.addColorStop(0, 'rgba(255,224,150,0.95)');
  glow.addColorStop(0.35, 'rgba(255,197,66,0.45)');
  glow.addColorStop(1, 'rgba(255,197,66,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(tx, ty, glowR, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff3cf';
  ctx.beginPath(); ctx.arc(tx, ty, Math.max(1.5, step * 0.16), 0, Math.PI * 2); ctx.fill();

  // bark rim where the face meets the wall
  ringPath(cx, cy, ringR(23) + step * 0.85, 23, step * 1.6, 0, Math.PI * 2);
  ctx.lineWidth = step * 0.5;
  ctx.strokeStyle = 'rgba(122,90,56,0.95)';
  ctx.stroke();
  ringPath(cx, cy, ringR(23) + step * 1.18, 23, step * 1.6, 0, Math.PI * 2);
  ctx.lineWidth = Math.max(1, step * 0.10);
  ctx.strokeStyle = 'rgba(93,65,38,0.9)';
  ctx.stroke();

  // pith: the small knot at the centre, midnight
  ctx.fillStyle = '#6b4a26';
  ctx.beginPath(); ctx.arc(cx, cy, step * 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(238,227,200,0.5)';
  ctx.beginPath(); ctx.arc(cx - step * 0.12, cy - step * 0.12, step * 0.09, 0, Math.PI * 2); ctx.fill();

  // twig hands: hour short, minute long, both delicate twigs
  const hourAngle = ((hrs % 12) / 12) * Math.PI * 2 - Math.PI / 2;
  const minAngle = (minuteFrac) * Math.PI * 2 - Math.PI / 2;
  drawTwigHand(cx, cy, maxR * 0.34, hourAngle, Math.max(1.2, step * 0.16));
  drawTwigHand(cx, cy, maxR * 0.52, minAngle, Math.max(1, step * 0.13));
  ctx.fillStyle = '#6b4a2f';
  ctx.beginPath(); ctx.arc(cx, cy, Math.max(1.6, step * 0.18), 0, Math.PI * 2); ctx.fill();

  // hour marks, every third hour, along the top ray
  if (showLabels) {
    ctx.fillStyle = 'rgba(' + INK + ',0.8)';
    ctx.font = Math.max(9, Math.round(step * 0.62)) + 'px Georgia,\'Times New Roman\',serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let hh = 0; hh < 24; hh += 3) {
      const rr = ringR(hh) + wobble(hh, -Math.PI / 2, step);
      const lx = cx, ly = cy - rr - step * 0.55;
      ctx.strokeStyle = 'rgba(243,236,220,0.92)';   // paper halo, legible over the wood
      ctx.lineWidth = 3;
      ctx.strokeText(String(hh).padStart(2, '0'), lx, ly);
      ctx.fillText(String(hh).padStart(2, '0'), lx, ly);
    }
  }

  ctx.restore();

  // bark detail on the visible crescent below the face: the face
  // disc overlaps the wall's upper part, so texture lives only
  // in the crescent between the face's bottom arc and the log's
  // bottom edge, clipped to that shape.
  const faceR = ringR(23) + step * 0.85;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx - faceR, cy);
  ctx.ellipse(cx, cy, faceR, faceR * SQUASH, 0, Math.PI, 0, true);
  ctx.lineTo(cx + maxR, cy + wallH);
  ctx.ellipse(cx, cy + wallH, maxR, maxR * SQUASH, 0, 0, Math.PI, false);
  ctx.closePath();
  ctx.clip();
  // sunlight falling on the wall's left side
  const wallSun = ctx.createLinearGradient(cx - maxR, cy, cx + maxR * 0.3, cy);
  wallSun.addColorStop(0, 'rgba(255,240,210,0.20)');
  wallSun.addColorStop(1, 'rgba(255,240,210,0)');
  ctx.fillStyle = wallSun;
  ctx.fillRect(cx - maxR, cy, maxR * 2, wallH + maxR * SQUASH);
  // vertical bark ridges: dark furrow with a light crest beside it
  for (const bs of MEADOW.barkStrokes) {
    const bx = cx + (bs.x * 2 - 1) * maxR * 0.97;
    const dx = bx - cx;
    const topY = cy + SQUASH * Math.sqrt(Math.max(0, faceR * faceR - dx * dx));
    const botY = cy + wallH + SQUASH * Math.sqrt(Math.max(0, maxR * maxR - dx * dx));
    if (botY - topY < 5) continue;
    const sway = (bs.x - 0.5) * 8;
    ctx.lineWidth = Math.max(1, maxR * 0.009);
    ctx.strokeStyle = 'rgba(60,40,20,' + bs.a + ')';
    ctx.beginPath();
    ctx.moveTo(bx, topY + 2);
    ctx.quadraticCurveTo(bx + sway * 0.4, (topY + botY) / 2, bx + sway, botY - 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(180,145,95,' + (bs.a * 0.8) + ')';
    ctx.lineWidth = Math.max(0.7, maxR * 0.005);
    ctx.beginPath();
    ctx.moveTo(bx + maxR * 0.012, topY + 2);
    ctx.quadraticCurveTo(bx + maxR * 0.012 + sway * 0.4, (topY + botY) / 2, bx + maxR * 0.012 + sway, botY - 2);
    ctx.stroke();
  }
  // a few short horizontal cracks in the bark
  for (const bs of MEADOW.barkStrokes.slice(0, 8)) {
    if (!bs.dark) continue;
    const bx = cx + (bs.x * 2 - 1) * maxR * 0.9;
    const dx = bx - cx;
    const topY = cy + SQUASH * Math.sqrt(Math.max(0, faceR * faceR - dx * dx));
    const botY = cy + wallH + SQUASH * Math.sqrt(Math.max(0, maxR * maxR - dx * dx));
    const by = topY + (botY - topY) * 0.5;
    ctx.strokeStyle = 'rgba(60,40,20,0.35)';
    ctx.lineWidth = Math.max(0.7, maxR * 0.005);
    ctx.beginPath();
    ctx.moveTo(bx - maxR * 0.02, by);
    ctx.quadraticCurveTo(bx, by + 2, bx + maxR * 0.02, by - 1);
    ctx.stroke();
  }
  ctx.restore();

  // soft warm vignette, like the reference's paper edge
  const vg = ctx.createRadialGradient(cx, h * 0.45, Math.min(w, h) * 0.35, cx, h * 0.45, Math.max(w, h) * 0.75);
  vg.addColorStop(0, 'rgba(120,90,50,0)');
  vg.addColorStop(1, 'rgba(120,90,50,0.10)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, w, h);

  // the meadow around the log: grass, fallen leaves, tiny flowers, pebbles.
  // Band runs from the log's lower sides down to clear of the bottom text.
  const bandTop = cy + maxR * SQUASH * 0.6, bandBottom = h - 95;
  const bandY = f => bandTop + f * Math.max(0, bandBottom - bandTop);
  const onWood = (x, y) => {  // inside the log's footprint (face or wall)
    const dx = (x - cx) / maxR, dy = (y - cy - wallH * 0.5) / (maxR * SQUASH + wallH * 0.6);
    if (Math.sqrt(dx * dx + dy * dy) < 1.04) return true;
    if (Math.abs(x - cx) < maxR * 1.02 && y > cy && y < cy + wallH + step) return true;
    return false;
  };
  for (const gr of MEADOW.grass) {
    const gx = gr.x * w, gy = bandY(gr.y);
    if (onWood(gx, gy - gr.h * Math.max(w, h) * 0.5)) continue;  // not out of the wood
    drawGrass(gx, gy, gr.h * Math.max(w, h), gr.lean, gr.blades);
  }
  for (const lf of MEADOW.leaves) {
    const lx = lf.x * w, ly = bandY(lf.y);
    if (onWood(lx, ly)) continue;  // leaves stay on the ground, never on the wood
    if (lf.maple) drawMapleLeaf(lx, ly, lf.s * Math.max(w, h), lf.rot, lf.col);
    else drawOvalLeaf(lx, ly, lf.s * Math.max(w, h), lf.rot, lf.col);
  }
  for (const fl of MEADOW.flowers) {
    const fx = fl.x * w, fy = bandY(fl.y);
    if (onWood(fx, fy)) continue;
    drawFlower(fx, fy, fl.s * Math.max(w, h), fl.pink);
  }
  for (const pb of MEADOW.pebbles) {
    const px = pb.x * w, py = bandY(pb.y);
    if (onWood(px, py)) continue;
    ctx.fillStyle = 'rgba(140,125,100,0.35)';
    ctx.beginPath(); ctx.arc(px, py, pb.r * Math.max(w, h), 0, Math.PI * 2); ctx.fill();
  }

  // the time, small and plain, bottom centre
  const hh = Math.floor(hrs), mm = Math.floor((hrs - hh) * 60);
  clockEl.textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');

  if (!hintHidden && nowMs > 6000) { hintEl.style.opacity = '0'; hintHidden = true; }
}

function loop(nowMs) {
  drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(typeof performance !== 'undefined' ? performance.now() : 0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

canvas.addEventListener('pointerdown', () => {
  showLabels = !showLabels;
  if (hintEl) hintEl.style.opacity = '0';
  hintHidden = true;
});
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
